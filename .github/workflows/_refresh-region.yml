name: _refresh-region (callable)

# Reusable workflow that does the FULL refresh pipeline (data + wind
# + viz + validation) for one region. Per-region wrappers in
# refresh-ca.yml / refresh-pnw.yml / refresh-tropical.yml `uses:` this
# file with `region:` set, so the user-facing list of workflows is
# 3-per-region (one button per region) while the implementation stays
# in one place. Same fetchers, same env, same commit shape — only the
# SHOULDIDIVE_REGION + the CA-only validation/deploy steps differ.
#
# Why one workflow per region (not a 3x matrix over a single workflow)?
# Each region has its own cron schedule, its own "is this prod?"
# semantics, and the user wants to see them as 3 separate top-level
# entries in the Actions tab. Matrix would lump them together.

on:
  workflow_call:
    inputs:
      region:
        description: "Region slug — ca | pnw | tropical"
        required: true
        type: string
      deploy_prod:
        description: "Run the Cloudflare deploy step pushing to shouldidive.com (CA only)"
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the region. Every fetch_*.py reads
      # this at module load to pick bbox + output dir + (where
      # applicable) layer range overrides.
      SHOULDIDIVE_REGION: ${{ inputs.region }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # ---------------------------------------------------------------
      # FETCH — every region runs every fetcher. The fetchers
      # themselves handle "no data for this bbox" gracefully (e.g.
      # HFRNet has no Caribbean coverage; fetch_currents falls back to
      # tide-and-wind inference). continue-on-error: true everywhere so
      # one flaky NOAA endpoint doesn't gate the deploy.
      # ---------------------------------------------------------------

      - name: Fetch latest ocean data (SST, chl, kd490)
        continue-on-error: true
        timeout-minutes: 15
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch.py

      - name: Fetch latest WaveWatch III
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_waves.py

      - name: Fetch 7-day precipitation (NOAA CPC)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_precip.py

      - name: Fetch river discharge (USGS NWIS)
        # CA-only sites in the station list today. PNW + tropical
        # produce empty rivers.json. PR-PNW-1 / PR-TROP-7 fills in
        # the regional river sites.
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_rivers.py

      - name: Fetch tide range (NOAA CO-OPS)
        # Same CA-only station list situation as rivers above.
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Fetch bathymetry (one-shot)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_bathy.py

      - name: Fetch coastline (one-shot, bbox-locked)
        continue-on-error: true
        timeout-minutes: 8
        run: python pipeline/fetch_coastline.py

      - name: Fetch MPA boundaries
        # CDFW source is CA-only. PNW + tropical land empty MPA file.
        # PR-PNW-4 / PR-TROP-6 add Olympic Coast NMS / WDPA polygons.
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_mpa.py

      - name: Fetch wind (HRRR now / +6h / +24h)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind (HRRR f00-f48 + GFS f49-f120)
        # Heaviest single step — ~121 hourly slices over the wire.
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_wind_5day.py

      - name: Fetch 5-day hourly swell (gfswave)
        continue-on-error: true
        timeout-minutes: 10
        run: python pipeline/fetch_swell_5day.py

      - name: Fetch surface currents
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_currents.py

      - name: Probe all external feeds
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/check_feeds.py

      # ---------------------------------------------------------------
      # DERIVED — runs after the inputs are committed to disk.
      # ---------------------------------------------------------------

      - name: Run 5-day SST forecast
        continue-on-error: true
        run: python pipeline/fetch_sst_5day.py

      - name: Run visibility prediction
        # tropical's viz_model_variant=subtractive_tropical is not
        # implemented yet — PR-TROP-5. Until then, viz on tropical
        # uses the chl-based model which is the wrong shape for
        # that water. Soft-fail handles that.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      # ---------------------------------------------------------------
      # ASSERTIONS — every region runs the cheap freshness checks.
      # Soft-fail (the watchdog issue sync surfaces findings).
      # ---------------------------------------------------------------

      - name: Assert chl freshness sidecar
        continue-on-error: true
        run: python -m pipeline.tests.assert_outputs fetch_chl

      - name: Assert visibility outputs + freshness gating
        continue-on-error: true
        run: python -m pipeline.tests.assert_outputs visibility

      - name: Assert local manifest freshness budgets
        continue-on-error: true
        run: python pipeline/check_manifest_freshness.py --layers sst,sst7d,sst5d,chl,kd490,wind,wind5d,swell5d,current5d,viz,wave,precip --check-sst-source

      # ---------------------------------------------------------------
      # CA-ONLY VALIDATION — observations.jsonl + per_zone_metrics
      # baselines are all CA-keyed today. PNW + tropical would no-op
      # or fail noisily; skip until those regions have ground-truth
      # ingest set up (PR-NC-4 / PR-PNW-2 / PR-TROP-7 follow-ups).
      # ---------------------------------------------------------------

      - name: Score SST predictions vs buoy + dive-log obs (Phase C)
        if: inputs.region == 'ca'
        continue-on-error: true
        run: python -m validation.sst_score
        working-directory: pipeline

      - name: SST watchdog — analyse SST metrics, flag anomalies
        if: inputs.region == 'ca'
        continue-on-error: true
        id: sst_watchdog
        run: python -m validation.sst_watchdog
        working-directory: pipeline

      - name: Score visibility predictions against ground-truth
        if: inputs.region == 'ca'
        continue-on-error: true
        run: python -m pipeline.validation.score

      - name: Regression guard — fail build if RMSE jumps >20%
        if: inputs.region == 'ca'
        run: python -m pipeline.validation.check_regression

      - name: Watchdog — analyse metrics, flag anomalies
        if: inputs.region == 'ca'
        id: watchdog
        continue-on-error: true
        run: python -m pipeline.validation.watchdog

      - name: Sync watchdog GitHub Issue
        if: always() && inputs.region == 'ca'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create validation-watchdog \
            --color C1880F \
            --description "Auto-managed by pipeline/validation/watchdog.py" \
            2>/dev/null || true
          summary_file=pipeline/validation/data/watchdog_summary.md
          existing=$(gh issue list --label validation-watchdog --state open --json number --jq '.[0].number')
          if [ "${{ steps.watchdog.outcome }}" = "failure" ]; then
            count=$(grep -c '^### ' "$summary_file" || true)
            title="Validation watchdog — ${count} finding(s)"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title" --body-file "$summary_file"
            else
              gh issue create --label validation-watchdog --title "$title" --body-file "$summary_file"
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "All findings cleared as of $(date -u +%Y-%m-%dT%H:%MZ)."
            fi
          fi

      # ---------------------------------------------------------------
      # BUILD + DEPLOY — only CA + only when running on main pushes
      # to production. Other regions still build (catches Vite errors)
      # but skip the wrangler push.
      # ---------------------------------------------------------------

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend regression tests
        continue-on-error: true
        run: npm test

      - name: Run data feature contracts
        continue-on-error: true
        run: npm run test:data-contracts

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        # Two gates: caller must opt in via inputs.deploy_prod AND the
        # checkout must be on `main`. Everything dev-side skips this.
        if: inputs.deploy_prod && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=main --commit-dirty=true

      - name: Commit refreshed data
        # always() so a failure in build/test/deploy doesn't drop the
        # freshly-refreshed PNGs on the floor. The schedule + dispatch
        # gate stays so PR-triggered runs don't try to push.
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          git add pipeline/validation/data/per_zone_metrics.json \
                  pipeline/validation/data/residuals.jsonl \
                  pipeline/validation/data/watchdog_summary.md \
                  pipeline/validation/data/feed_health.json \
                  pipeline/validation/data/freshness_health.json \
                  pipeline/validation/data/ingest_health.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh ${{ inputs.region }} $(date -u +%Y-%m-%d)"
            # Retry the push if a concurrent commit landed on the same
            # branch between our local commit and now. Lost the git-push
            # race twice today across PNW+tropical dispatches; this
            # rebase-and-retry loop fixes it without manual intervention.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push failed (attempt $attempt) — pulling rebase and retrying"
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi
