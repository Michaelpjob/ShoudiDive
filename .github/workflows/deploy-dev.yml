name: Deploy dev preview

# Builds and deploys the React PWA to the dev preview URL on every push
# to dev — but only AFTER dev-checks.yml passes. Cloudflare Pages
# automatically serves non-production-branch deploys at
# `<branch>.shouldidive.pages.dev`, so this lands at
# https://dev.shouldidive.pages.dev for visual verification.
#
# Distinct from refresh-data.yml in three ways:
#   * No data refresh — uses the PNGs already committed in public/data/
#     (production data on the previous main deploy), so a code-only dev
#     change can be reviewed without re-pulling NOAA / NASA feeds.
#   * No commits back — the workflow runs read-only on contents.
#   * --branch=dev means CF Pages routes this to the preview URL, NOT
#     production at shouldidive.com.

on:
  workflow_run:
    # Only deploy after dev-checks completes successfully.
    workflows: ["Dev checks"]
    types: [completed]
    branches: [dev]
  # Data-only pushes to dev (the main→dev data sync, the hourly beta
  # refreshes) are `paths-ignore`'d out of Dev checks, so WITHOUT this
  # trigger they never redeploy the dev site — the preview would serve
  # fresh code but STALE DATA. That's the second half of the 2026-06-24
  # dev-freshness freeze: even once data reached the `dev` branch, the
  # site only rebuilt when a CODE change happened to ride along. A
  # data-only change doesn't need the code gate (prod's refresh-data
  # deploys data directly too), so deploy straight from the dev push.
  push:
    branches: [dev]
    paths:
      - "public/data/**"
  workflow_dispatch:

# Don't pile up deploys on rapid-fire dev pushes.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only run if dev-checks succeeded — workflow_run fires on success
    # AND failure, so we have to gate explicitly. A direct data-only
    # `push` (no workflow_run payload) carries no code gate to satisfy,
    # so it deploys unconditionally.
    # Same-repo origin guard on the workflow_run branch: only deploy when
    # the triggering run came from THIS repo (not a fork). The push +
    # workflow_dispatch branches carry no untrusted ref and are unaffected.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      # head_sha checkout is guarded by the same-repo `if:` above + the repo
      # takes no external PRs, so the ref is trusted. The residual static
      # pattern is the intended, reviewed behavior.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # workflow_run runs on the default branch's HEAD by default;
          # explicitly check out the same SHA dev-checks ran against
          # so the preview matches what was tested.
          ref: ${{ github.event.workflow_run.head_sha || 'dev' }}

      # --branch=dev tags this deploy as a Cloudflare Pages preview
      # (not production). CF Pages routes dev preview deploys to
      # dev.shouldidive.pages.dev automatically; shouldidive.com is
      # unaffected. Wrangler-bypass logic lives in the composite.
      - uses: ./.github/actions/deploy-cloudflare
        with:
          branch: dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Annotate run with preview URL
        run: |
          {
            echo "## Dev preview deployed"
            echo
            echo "Preview URL: https://dev.shouldidive.pages.dev"
            echo "Commit:      \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo
            echo "_Production at shouldidive.com is unchanged. To promote, open a PR from \`dev\` → \`main\`._"
          } >> "$GITHUB_STEP_SUMMARY"
