name: Deploy dev preview

# Builds and deploys the React PWA to the dev preview URL on every push
# to dev — but only AFTER dev-checks.yml passes. Cloudflare Pages
# automatically serves non-production-branch deploys at
# `<branch>.shouldidive.pages.dev`, so this lands at
# https://dev.shouldidive.pages.dev for visual verification.
#
# Distinct from refresh-data.yml in three ways:
#   * No data refresh — uses the PNGs already committed in public/data/
#     (production data on the previous main deploy), so a code-only dev
#     change can be reviewed without re-pulling NOAA / NASA feeds.
#   * No commits back — the workflow runs read-only on contents.
#   * --branch=dev means CF Pages routes this to the preview URL, NOT
#     production at shouldidive.com.

on:
  workflow_run:
    # Only deploy after dev-checks completes successfully.
    workflows: ["Dev checks"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to deploy (branch name or commit SHA)"
        required: true
        default: "dev"
        type: string
      preview_branch:
        description: "Cloudflare Pages preview slug (becomes <slug>.shouldidive.pages.dev). Defaults to the git ref."
        required: false
        default: ""
        type: string

# Don't pile up deploys on rapid-fire dev pushes.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only run if dev-checks succeeded — workflow_run fires on success
    # AND failure, so we have to gate explicitly.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs on the default branch's HEAD by default;
          # explicitly check out the same SHA dev-checks ran against
          # so the preview matches what was tested. workflow_dispatch
          # accepts a branch input so any branch can be deployed to
          # its own preview URL on demand (used for visually reviewing
          # big changes like the NorCal expansion before merging).
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch || 'dev' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        # `npm install` rather than `npm ci` to tolerate the lockfile
        # drift introduced 2026-05-07 (new ESLint + puppeteer deps).
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Resolve preview slug
        id: slug
        # `--branch=<slug>` on the wrangler command tags the deploy as
        # a CF Pages preview (NOT production). The slug becomes the
        # subdomain: <slug>.shouldidive.pages.dev. For workflow_run
        # triggers we always use "dev"; for workflow_dispatch the user
        # picks the slug explicitly OR we sanitize the git ref.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slug="${{ inputs.preview_branch }}"
            if [ -z "$slug" ]; then
              slug="${{ inputs.branch }}"
            fi
          else
            slug="dev"
          fi
          # CF Pages slug must be DNS-safe: lowercase, [a-z0-9-], <= 28 chars.
          slug=$(echo "$slug" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//' | cut -c1-28)
          if [ -z "$slug" ]; then slug="dev"; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Deploying to slug: $slug"

      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=<slug> tags this deploy as a preview (not production).
          # CF Pages routes the preview to <slug>.shouldidive.pages.dev
          # automatically; production at shouldidive.com is unaffected.
          command: pages deploy dist --project-name=shouldidive --branch=${{ steps.slug.outputs.slug }} --commit-dirty=true

      - name: Annotate run with preview URL
        run: |
          {
            echo "## Preview deployed"
            echo
            echo "Preview URL: https://${{ steps.slug.outputs.slug }}.shouldidive.pages.dev"
            echo "Commit:      \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo
            echo "_Production at shouldidive.com is unchanged. To promote, merge the matching PR to \`main\`._"
          } >> "$GITHUB_STEP_SUMMARY"
