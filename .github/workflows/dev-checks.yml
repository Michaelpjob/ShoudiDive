name: Dev checks

# Test gate that every change passes before reaching main.
#
# Triggers on:
#   * push to `dev`        — agents (Claude Code, Codex) commit here first
#   * pull_request → main  — same checks block the merge
#   * workflow_dispatch    — manual re-run
#
# Status checks declared here are wired into main's branch-protection
# rules so PRs cannot merge red. To add a new gate: add a job here, then
# add its job-name to the required_status_checks list in
# scripts/setup-branch-protection.sh and re-run that script.

on:
  push:
    branches: [dev]
    # Bot data commits (ca-beta refreshes pushing to dev hourly, the
    # main→dev data syncs) must not burn dev-check runs — they were
    # the bulk of #137's red noise. A push is skipped only when EVERY
    # changed file matches; any code change still runs the gate.
    # sync-dev.yml separately dispatches dev-checks when a sync brings
    # code to dev (GITHUB_TOKEN pushes don't fire triggers).
    paths-ignore:
      - "public/data/**"
      - "public/data-*/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier in-flight runs on the same ref when a new commit lands —
# saves CI minutes when an agent pushes a quick fix on top of a previous
# push that's still running.
concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------
  # Pipeline (Python)
  # Mirrors the existing `Pipeline tests` workflow's --unit layer so the
  # signal is identical. ~30 s on a clean cache.
  # ---------------------------------------------------------------------
  pipeline-tests:
    name: pipeline-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install
        run: |
          pip install -r pipeline/requirements.txt
          pip install pytest
      - name: Run unit + static layers
        run: bash pipeline/scripts/validate.sh --unit

  # ---------------------------------------------------------------------
  # Web build (Vite production bundle)
  # Catches: import-typo regressions, syntax errors in any module the
  # bundler reaches, missing/dropped deps, CSS reference failures.
  # The deploy step (deploy-dev.yml) runs the same command so a green
  # check here means the deploy will too.
  # ---------------------------------------------------------------------
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install
        # `npm install` rather than `npm ci` until the user regenerates
        # package-lock.json with the new ESLint + puppeteer deps. Once
        # that's done locally and committed, switch back to `npm ci`
        # for deterministic-from-lockfile installs. Same drift-tolerance
        # the mobile-static job uses.
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload bundle as artifact
        # Lets a reviewer download the dev build to spot-check size /
        # contents without having to clone + build locally.
        # Also consumed by the web-smoke job below so the smoke test
        # runs against the EXACT bytes web-build produced.
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Web lint (ESLint flat config)
  #
  # The exact gate that would have caught the 2026-05-07 white-screen
  # bug (ReferenceError: sstViewMode is not defined): `no-undef` is
  # the rule that fires on a dangling reference. ESLint runs in <5s so
  # this is a cheap, high-signal gate.
  # ---------------------------------------------------------------------
  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install
        # `npm install` rather than `npm ci` until the user regenerates
        # package-lock.json with the new ESLint + puppeteer deps. Once
        # that's done locally and committed, switch back to `npm ci`
        # for deterministic-from-lockfile installs. Same drift-tolerance
        # the mobile-static job uses.
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------
  # Web tests (existing tests/*.test.js — were not being run in CI)
  #
  # These exercise the source-level contracts that pinned the SST
  # forecast UI, the mobile interaction guards, and the data-feature
  # contracts. They've been in the repo for a while; they just weren't
  # wired into a gate, so a contract drift could land silently.
  # ---------------------------------------------------------------------
  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install
        # `npm install` rather than `npm ci` until the user regenerates
        # package-lock.json with the new ESLint + puppeteer deps. Once
        # that's done locally and committed, switch back to `npm ci`
        # for deterministic-from-lockfile installs. Same drift-tolerance
        # the mobile-static job uses.
        run: npm install --no-audit --no-fund
      - name: Run node:test suites
        run: npm test

  # ---------------------------------------------------------------------
  # Web runtime smoke (Puppeteer)
  #
  # Booting the BUILT bundle in headless Chrome and watching for
  # uncaught exceptions / console.error is the only gate that catches
  # "compiles + lints clean but crashes on first React render" bugs.
  # That's the failure class the white-screen incident was, and the
  # one neither web-build nor web-lint is structurally able to catch
  # (Vite happily bundles dead-letter references; ESLint catches
  # SOMETIMES if the reference is module-scope, missed it here because
  # it was inside a destructure-style render function). The smoke test
  # closes that gap by actually executing the code path.
  # ---------------------------------------------------------------------
  web-smoke:
    name: web-smoke
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install
        # Fresh install in this job — we need puppeteer's Chromium
        # download. Couldn't reuse the web-build job's node_modules
        # because that artifact is dist/ only. `npm install` (not
        # `npm ci`) until the lockfile is regenerated with puppeteer.
        run: npm install --no-audit --no-fund
      - name: Download dist artifact from web-build
        uses: actions/download-artifact@v8
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
      - name: Boot bundle + watch for runtime errors
        run: npm run test:runtime-smoke

  # ---------------------------------------------------------------------
  # Web visual paint (Puppeteer × 3 viewports × 5 layers)
  #
  # For each viewport (desktop / tablet / mobile), boots the bundle
  # and walks every layer chip, asserting the canvas paints non-
  # trivial pixels. Catches "this layer renders blank at mobile width"
  # regressions that the single-viewport runtime-smoke can't.
  #
  # Slower than runtime-smoke (~120 s) so it runs in its own job +
  # is NOT a required check yet — runs on every PR for visibility but
  # doesn't gate merge until the false-positive rate is understood.
  # See tests/CHECKPOINTS.md for the rationale.
  # ---------------------------------------------------------------------
  cp-visual-paint:
    name: cp-visual-paint
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Download dist artifact from web-build
        uses: actions/download-artifact@v8
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
      - name: 3 viewports × 5 layers paint check
        run: npm run test:visual-paint
      - name: Upload screenshots
        # 15 PNGs (3 viewports × 5 layers) + summary.json. Lets a
        # reviewer download the artifact to spot-check what each
        # combination actually rendered.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-paint-${{ github.sha }}
          path: test-output/visual-paint/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Mobile (jest unit tests + package alignment)
  #
  # We deliberately skip the heavier puppeteer / expo-export layers from
  # mobile/scripts/validate.sh — those need ~5 min and Chrome which the
  # ubuntu-latest runner doesn't carry by default. They run on schedule
  # via a separate workflow (TODO when needed); for the dev gate the
  # jest signal is sufficient to catch the regressions agents introduce
  # most often (data layer, colormap, manifest parsing).
  # ---------------------------------------------------------------------
  mobile-static:
    name: mobile-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        # `npm install` rather than `npm ci` — the mobile lockfile
        # historically drifts when an agent edits package.json without
        # regenerating it (no node on the user's Windows host = no
        # local lockfile regeneration). Until we wire a "regenerate
        # lock + commit" step in dev-checks itself, `npm install`
        # tolerates that drift in CI without blocking the gate.
        # The web-build job keeps `npm ci` because the root lockfile
        # is well-maintained.
        run: npm install --no-audit --no-fund
      - name: Jest unit tests
        # mobile/src/lib/__tests__/{colors,dataSource,mapData}.test.js —
        # the data layer + colormap correctness, no native required.
        run: npm test -- --colors=false

  # ---------------------------------------------------------------------
  # Secrets scan
  # Cheap grep-based defense against accidentally committing API keys
  # or .env files. Catches the most common patterns; not a substitute
  # for proper secret-rotation hygiene.
  # ---------------------------------------------------------------------
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for committed secrets
        run: |
          set -e
          fail=0

          # Patterns we DO want to allow (usage in workflow files /
          # docs is fine; only the actual values matter). The grep
          # below already excludes .github/workflows/ + the dev-routing
          # docs, so secrets-scan only fires on real secret values.

          # Common API key patterns (fixed hex/base64 lengths)
          patterns=(
            'sk-[a-zA-Z0-9]{32,}'                  # OpenAI / Anthropic
            'ghp_[a-zA-Z0-9]{36}'                  # GitHub PAT
            'gho_[a-zA-Z0-9]{36}'                  # GitHub OAuth
            'AKIA[0-9A-Z]{16}'                     # AWS access key
            'AIza[0-9A-Za-z_-]{35}'                # Google API key
            'xox[bps]-[0-9a-zA-Z]{10,}'            # Slack token
          )
          for pat in "${patterns[@]}"; do
            if git grep -InE "$pat" -- ':!*.md' ':!.github/' ':!*.lock' ':!package-lock.json' 2>/dev/null; then
              echo "::error::potential secret matching pattern: $pat"
              fail=1
            fi
          done

          # .env files should never be committed
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "::error::committed .env file detected"
            fail=1
          fi

          # PEM private keys. Same path exclusions as the API-key
          # patterns above so this pattern doesn't match the
          # workflow file or this commit's secret-scanning docs that
          # include the string literally as documentation.
          if git grep -l 'BEGIN RSA PRIVATE KEY\|BEGIN OPENSSH PRIVATE KEY\|BEGIN PRIVATE KEY' -- ':!*.md' ':!.github/' ':!*.lock' ':!package-lock.json' 2>/dev/null; then
            echo "::error::committed private key detected"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "secrets-scan: clean"

  # ---------------------------------------------------------------------
  # Workflow YAML lint — catches typos in workflow files themselves
  # before they break a future deploy. Cheap, no extra deps.
  # ---------------------------------------------------------------------
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          curl -sL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: Lint .github/workflows
        run: ./actionlint -color

  # ---------------------------------------------------------------------
  # Manifest contract validator — catches range/scale drift between
  # the pipeline's encoder and the frontend's decoder. The committed
  # public/data/manifest.json must match the LayerSpec contract in
  # pipeline/lib/layer_spec.py; if a fetcher silently changed its
  # output range without updating the spec (or vice versa), this
  # job fires before the bad manifest reaches production.
  #
  # Stdlib-only Python — no install layer needed. Runs in <5 s.
  # ---------------------------------------------------------------------
  manifest-validate:
    name: manifest-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate committed manifest against LayerSpec contract
        run: python -m pipeline.validate_manifest
