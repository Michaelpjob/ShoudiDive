name: Frontend tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        # `npm install` rather than `npm ci` until the lockfile is
        # regenerated locally with the new ESLint + puppeteer deps
        # added 2026-05-07. Drop back to `npm ci` after the next
        # local `npm install`. Same drift-tolerance the dev-checks
        # web jobs use.
        run: npm install --no-audit --no-fund

      - name: Run frontend regression tests
        run: npm test

      - name: Build
        run: npm run build
