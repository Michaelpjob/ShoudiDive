name: Promote validation baseline

# One-shot manual action to lock the current per_zone_metrics.json as
# the regression-guard baseline. Run this from the GitHub Actions UI
# once you're satisfied that the current model accuracy is what you
# want to defend against drift. After that, refresh-data.yml's
# regression-guard step will fail any future deploy that pushes any
# zone's RMSE >20% above this baseline.
#
# What it does:
#   1. Runs check_regression.py --promote-baseline, which copies
#      pipeline/validation/data/per_zone_metrics.json to
#      pipeline/validation/data/per_zone_metrics_baseline.json with a
#      promoted_at timestamp.
#   2. Commits + pushes the baseline file to main.
#
# When to run:
#   * After ≥30 days of observations have accumulated AND
#   * After you've eyeballed per_zone_metrics.json and the RMSE/bias
#     numbers look honest (per-zone n is comfortably above 30, the
#     biases line up with what you'd expect, no obvious outlier zones).

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Promote current metrics to baseline
        run: python -m pipeline.validation.check_regression --promote-baseline

      - name: Commit baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/validation/data/per_zone_metrics_baseline.json
          if git diff --staged --quiet; then
            echo "No baseline change to commit (already up to date)."
          else
            git commit -m "validation: promote baseline at $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          fi
