name: Refresh baja — wind (hourly)

# Baja Mexico (Pacific + Sea of Cortez) — HOURLY wind at :00.
# Time slot rationale: CA :15, PNW :30, tropical :45, CA-beta :50 →
# pick :00 (top of hour) for baja. HRRR covers down to ~22°N over
# Mexico (the full Baja peninsula and the Sea of Cortez), so HRRR
# is the primary wind source for the whole region; GFS fallback
# remains in fetch_wind.py for any sub-hour HRRR outages.
#
# Cadence recut 2026-07-13: wind is the priority layer and runs
# hourly; swell (gfswave) + WW3 waves + surface currents moved to
# the DAILY refresh-baja-data.yml.

# Schedule re-registered 2026-07-14: repo-wide cron freeze after the
# visibility flip + workflow-file merges; this commit forces GitHub to
# re-parse and re-arm the cron triggers.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: dev)"
        required: false
        default: "dev"
        type: string

concurrency:
  group: refresh-baja-wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: baja
    permissions:
      contents: write
      actions: write   # for `gh workflow run deploy-baja-beta.yml` at the end

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Baja promoted to prod 2026-05-20: scheduled cron now targets
          # main (matches refresh-ca-wind.yml). Manual workflow_dispatch
          # can still target dev via `branch: dev`.
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'main' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch wind (HRRR over Baja + GFS fallback)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_wind_5day.py

      - name: Commit refreshed baja wind data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/baja/
          if git diff --staged --quiet; then
            echo "No baja wind data changes to commit."
          else
            git commit -m "wind: refresh baja $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push failed (attempt $attempt) — rebasing"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi

      - name: Trigger production deploy (on main)
        # Hourly wind refresh on main → prod deploy. Matches
        # refresh-ca-wind.yml pattern.
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-prod.yml --ref main

      - name: Trigger baja-beta deploy (on dev)
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-baja-beta.yml --ref dev
