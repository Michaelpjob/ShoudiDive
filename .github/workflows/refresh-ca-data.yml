name: Refresh CA — data (daily)

# California — DAILY data refresh at 06:00 UTC.
# Pulls SST + chl + kd490 + viz + precip + rivers + tides + bathy +
# coastline + MPA. Bathy + coastline are one-shots (idempotent). The
# wind/swell/currents layers refresh on their own hourly schedule —
# see refresh-ca-wind.yml. Splitting wind off keeps wind fresh while
# keeping the heavy chl-blender + viz prediction on a daily cadence
# that matches the underlying satellite product update cycles.
#
# This workflow publishes shouldidive.com (when running on main).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: main)"
        required: false
        default: "main"
        type: string
      force_spot_bundles:
        description: "Rebuild Spot Detail bundles even if fresh (--force)"
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-ca-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: ca
    permissions:
      contents: write
      issues: write
      actions: write   # for `gh workflow run deploy-prod.yml` at the end

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'main' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest ocean data (SST, chl, kd490)
        # 2026-05-17: bumped from 15 → 35 min. The NorCal+SoCal bbox
        # expansion (2026-05-14, latMax 37.6→42.0 + lngMin -127→-128.5)
        # roughly doubled the pixel count. The 15-min budget that fit
        # the SoCal-only fetch in 3-4 min consistently hit the wall on
        # the wider bbox, silently leaving SST/chl/kd490 stale because
        # continue-on-error: true. The freshness asserts further down
        # also caught nothing because per-layer timestamps for the
        # non-failing fetchers (rivers, tides, precip, RTOFS) kept
        # advancing. live-cp-manifest finally surfaced it: manifest
        # 58.7h stale on 2026-05-17.
        continue-on-error: true
        # Skip the slow ocean fetch on a force_spot_bundles run. That path
        # exists only to rebuild Spot Detail bundles + redeploy, and the
        # bundles (bathy/coastline/kelp/mpa) don't depend on today's
        # SST/chl/kd490. Skipping avoids burning the 35-min timeout cap and
        # lets the freshness sentinels below skip too (they'd otherwise trip
        # on the deliberately-unrefreshed data and kill the run).
        if: ${{ !inputs.force_spot_bundles }}
        # 2026-06-16: 35 → 75 min. The fetch is normally ~3 min, but NOAA
        # ERDDAP had a slow spell 2026-06-15/16 where SST (7 days of 1 km
        # MUR over the wide bbox) crawled to 35+ min — the 06-15 run barely
        # finished at the 35-min cap, 06-16 timed out and the content
        # sentinel then failed the whole run, freezing SST/chl/kd490 on prod
        # for 2 days. A generous cap lets the daily refresh ride out an
        # ERDDAP-slow day instead of failing. (If it keeps recurring, the
        # real fix is to parallelize fetch.py's per-day requests.)
        timeout-minutes: 75
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          # Copernicus Marine (EU) chl backstop in chl_blend.py — dormant until
          # these secrets are added; harmless empty strings otherwise.
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python pipeline/fetch.py

      - name: Sentinel — fail loudly if ocean fetch produced no fresh output
        if: ${{ !inputs.force_spot_bundles }}
        # The previous step has `continue-on-error: true` so a timeout
        # there is silent. This sentinel checks the canonical SST PNG's
        # mtime to detect that case and fails the workflow loudly. Without
        # this guard, the workflow happily commits stale data and only
        # the post-deploy live-cp probe (~36h later) catches the freeze.
        # See 2026-05-15→17 incident. Threshold 30 min is comfortably
        # larger than the fetch step's healthy runtime (~3-4 min) and
        # smaller than the new 35-min timeout cap.
        run: python pipeline/check_fetch_freshness.py --layer sst

      - name: Fetch 7-day precipitation (NASA GPM IMERG)
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch_precip.py

      - name: Fetch CA river discharge (USGS NWIS)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_rivers.py

      - name: Fetch CA tide range (NOAA CO-OPS)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Fetch bathymetry (one-shot)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_bathy.py

      - name: Fetch coastline (one-shot)
        continue-on-error: true
        timeout-minutes: 8
        run: python pipeline/fetch_coastline.py

      - name: Fetch MPA boundaries
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_mpa.py

      - name: Fetch SCI Navy closures (scisland.org)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_sci_closures.py

      - name: Probe all external feeds
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/check_feeds.py

      - name: Run 5-day SST forecast
        continue-on-error: true
        run: python pipeline/fetch_sst_5day.py

      - name: Run visibility prediction
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      - name: Derive water-column visibility (two-layer profile)
        # PRD water-column C1 — derives cliff depth + below-cliff vis
        # from this run's own outputs (viz/wind/wave/bathy/tides); no
        # network. Must run AFTER fetch_visibility. Degrades to a
        # no-op when inputs are missing.
        continue-on-error: true
        timeout-minutes: 3
        run: python pipeline/fetch_viz_column.py

      - name: Build Spot Detail bundles (idempotent, ~30-day TTL)
        # Per-spot pre-computed bathy + contours + clipped overlays for
        # the Spot Detail view (Phase 1B — docs/spot-detail-handover.md).
        # 22 CA spots today (4 pilots + 7 Channel Islands + 10 shore hubs
        # + Coronados). The script self-skips bundles fresher than 30 days,
        # so the daily cron does real work ~once a month — and only for the
        # handful that expired that day. The Commit refreshed data step
        # below picks up public/data/spots/ automatically.
        #
        # The force_spot_bundles workflow_dispatch input maps to --force,
        # used to invalidate the on-disk cache when the builder itself
        # has changed (contour sizing, encoding, etc.).
        #
        # 90-min budget: a forced full rebuild fetches GMRT bathy + CDFW
        # kelp per spot for all 22 sequentially (~3-4 min each on the big
        # island bboxes), which overran the old 30-min cap and left the run
        # with no index update. build_spot_bundles.py now re-emits
        # index.json after every spot, so even if a rebuild still times out
        # the finished bundles stay committed + discoverable.
        continue-on-error: true
        timeout-minutes: 90
        run: |
          if [ "${{ inputs.force_spot_bundles }}" = "true" ]; then
            python pipeline/build_spot_bundles.py --force
          else
            python pipeline/build_spot_bundles.py
          fi

      - name: Fetch RTOFS ocean-model forecast
        # Parallel SST forecast + surface currents from NOAA RTOFS.
        # ~620 MB transfer (4 sample leads × ~155 MB). 25-min timeout
        # generous: NOMADS streams each ~1-2 min on a healthy day.
        # Walks back to prior day's 00z cycle if today's hasn't fully
        # landed by 06:00 UTC.
        continue-on-error: true
        # Skip on a force_spot_bundles run — RTOFS is a ~620 MB ocean-model
        # pull unrelated to the Spot Detail bundles; no need to spend up to
        # 25 min on it when the run only rebuilds bundles + redeploys.
        if: ${{ !inputs.force_spot_bundles }}
        timeout-minutes: 25
        run: python pipeline/fetch_rtofs.py

      # ---- CA validation ----
      - name: Assert chl freshness sidecar
        continue-on-error: true
        run: python -m pipeline.tests.assert_outputs fetch_chl

      - name: Assert visibility outputs
        continue-on-error: true
        run: python -m pipeline.tests.assert_outputs visibility

      - name: Assert local manifest freshness budgets
        continue-on-error: true
        run: python pipeline/check_manifest_freshness.py --layers sst,sst7d,sst5d,chl,kd490,viz,wave,precip --check-sst-source

      - name: Score SST predictions
        continue-on-error: true
        run: python -m validation.sst_score
        working-directory: pipeline

      - name: SST watchdog
        continue-on-error: true
        id: sst_watchdog
        run: python -m validation.sst_watchdog
        working-directory: pipeline

      - name: Score visibility predictions
        continue-on-error: true
        run: python -m pipeline.validation.score

      - name: Regression guard
        run: python -m pipeline.validation.check_regression

      - name: Watchdog
        id: watchdog
        continue-on-error: true
        run: python -m pipeline.validation.watchdog

      - name: Sync watchdog GitHub Issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create validation-watchdog --color C1880F \
            --description "Auto-managed by pipeline/validation/watchdog.py" 2>/dev/null || true
          summary_file=pipeline/validation/data/watchdog_summary.md
          existing=$(gh issue list --label validation-watchdog --state open --json number --jq '.[0].number')
          if [ "${{ steps.watchdog.outcome }}" = "failure" ]; then
            count=$(grep -c '^### ' "$summary_file" || true)
            title="Validation watchdog — ${count} finding(s)"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title" --body-file "$summary_file"
            else
              gh issue create --label validation-watchdog --title "$title" --body-file "$summary_file"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All findings cleared as of $(date -u +%Y-%m-%dT%H:%MZ)."
          fi

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend regression tests
        continue-on-error: true
        run: npm test

      - name: Run data feature contracts
        continue-on-error: true
        run: npm run test:data-contracts

      # Build + deploy steps were removed 2026-05-13 — this workflow
      # is now data-only. After committing fresh PNGs to main, the
      # "Trigger production deploy" step at the bottom fires
      # deploy-prod.yml via workflow_dispatch, which handles the
      # Cloudflare Pages publish. Splitting these two responsibilities
      # lets us iterate on the bundle (push to dev → deploy-dev fires)
      # without having to refire the heavy data pipeline.

      - name: Coverage guard — keep last-good for any near-empty layer
        # always() is REQUIRED. An earlier step that FAILS — e.g. the
        # post-fetch freshness sentinel firing on a degraded chl_1d — would
        # otherwise skip this guard (a custom `if:` still carries an implicit
        # success()), yet the commit step below runs with if: always() and
        # would land the degraded layer anyway. That stranded a 9%-valid
        # chl_1d on main twice (e.g. run 27666503612: fetch ok → freshness
        # sentinel FAILED → guard SKIPPED → commit still ran), breaking
        # test_no_nan_floods for every open PR. always() runs the guard so it
        # restores last-good BEFORE the always-commit, regardless of prior
        # failures. A flaky / dead ERDDAP source emits a near-empty 1-day
        # composite; this restores the prior good PNG from HEAD for any layer
        # below its valid floor (an all-failed fetch → every layer restored to
        # HEAD = unchanged → the unchanged-sentinel below still trips).
        if: ${{ always() && !inputs.force_spot_bundles }}
        continue-on-error: true
        run: python pipeline/check_coverage_guard.py

      - name: Sentinel — fail if SST/chl/wind PNGs unchanged from HEAD
        if: ${{ !inputs.force_spot_bundles }}
        # Complements `check_fetch_freshness.py` (which is mtime-based,
        # catches "fetcher didn't run") with a content-based check that
        # catches "fetcher ran but produced byte-identical output."
        # Real ocean data should produce at least one differing byte
        # across SST + chl + wind on every refresh; if all three are
        # identical to git HEAD, a swallowed-exception silent failure
        # is the most likely cause. NOT continue-on-error: this needs
        # to fail the run so the bot inbox lights up.
        run: python pipeline/check_data_changed.py

      - name: Commit refreshed data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          git add pipeline/validation/data/per_zone_metrics.json \
                  pipeline/validation/data/residuals.jsonl \
                  pipeline/validation/data/watchdog_summary.md \
                  pipeline/validation/data/feed_health.json \
                  pipeline/validation/data/freshness_health.json \
                  pipeline/validation/data/ingest_health.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh ca $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push failed (attempt $attempt) — rebasing"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi

      - name: Trigger production deploy
        # Build + publish to Cloudflare Pages happens in deploy-prod.yml
        # so this workflow stays single-purpose (data fetch + commit).
        # The explicit dispatch is needed because pushes made by the
        # default GITHUB_TOKEN don't fire downstream workflows; this
        # ensures the deploy fires regardless of which token the
        # commit step used.
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-prod.yml --ref main
