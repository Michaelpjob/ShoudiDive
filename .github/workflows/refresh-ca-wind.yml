name: Refresh CA — wind (hourly)

# California — HOURLY wind/swell/currents refresh at :15 past every
# hour. Matches the cadence of the upstream NOAA HRRR + GFS + WW3
# +HFR sources. Triggers a separate Cloudflare deploy so the live
# site reflects fresh wind within ~10 min of the latest model run.
#
# Daily SST/chl/viz/etc refresh lives in refresh-ca-data.yml. Keeping
# wind on its own hourly file lets us bound the per-run cost (no chl
# blender, no viz prediction, no validation suite) and run 24x per
# day cheaply.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: main)"
        required: false
        default: "main"
        type: string

concurrency:
  group: refresh-ca-wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: ca
    permissions:
      contents: write
      actions: write   # for `gh workflow run deploy-prod.yml` at the end

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'main' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch wind (HRRR now / +6h / +24h)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_wind_5day.py

      - name: Fetch 5-day hourly swell
        continue-on-error: true
        timeout-minutes: 10
        run: python pipeline/fetch_swell_5day.py

      - name: Fetch WaveWatch III nowcast
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_waves.py

      - name: Fetch surface currents
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_currents.py

      - name: Assert wind/swell freshness budgets
        continue-on-error: true
        run: python pipeline/check_manifest_freshness.py --layers wind,wind5d,swell5d,current5d --skip-top-level

      # Build + deploy steps were removed 2026-05-13 — data-only flow.
      # See deploy-prod.yml (triggered below) for the publish.

      - name: Commit refreshed wind data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git diff --staged --quiet; then
            echo "No wind data changes to commit."
          else
            git commit -m "wind: refresh ca $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push failed (attempt $attempt) — rebasing"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi

      - name: Trigger production deploy
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-prod.yml --ref main
