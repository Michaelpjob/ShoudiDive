name: Refresh CA — wind (hourly)

# California — HOURLY wind refresh at :15 past every hour. HRRR
# issues a new model run every hour, so hourly is the honest max
# cadence for the nowcast; wind5d (GFS, 4 cycles/day) rides along
# and simply no-ops between GFS cycles. Triggers a separate
# Cloudflare deploy so the live site reflects fresh wind within
# ~10 min of the latest model run.
#
# Cadence recut 2026-07-13: wind is the priority layer and runs
# hourly; swell (gfswave) + WW3 waves + surface currents moved to
# the DAILY refresh-ca-data.yml. Their freshness budgets in
# pipeline/check_manifest_freshness.py were retuned to the daily
# cadence at the same time.
#
# Daily SST/chl/viz/etc refresh lives in refresh-ca-data.yml.

# Schedule re-registered 2026-07-14: repo-wide cron freeze after the
# visibility flip + workflow-file merges; this commit forces GitHub to
# re-parse and re-arm the cron triggers.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: main)"
        required: false
        default: "main"
        type: string

concurrency:
  group: refresh-ca-wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: ca
    permissions:
      contents: write
      actions: write   # for `gh workflow run deploy-prod.yml` at the end

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'main' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch wind (HRRR now / +6h / +24h)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_wind_5day.py

      - name: Assert wind freshness budgets
        continue-on-error: true
        # swell/wave/currents moved to the daily refresh-ca-data.yml
        # (cadence recut 2026-07-13); their budgets are asserted there.
        run: python pipeline/check_manifest_freshness.py --layers wind,wind5d --skip-top-level

      # Build + deploy steps were removed 2026-05-13 — data-only flow.
      # See deploy-prod.yml (triggered below) for the publish.

      - name: Commit refreshed wind data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git diff --staged --quiet; then
            echo "No wind data changes to commit."
          else
            git commit -m "wind: refresh ca $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push failed (attempt $attempt) — rebasing"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi

      - name: Trigger production deploy
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-prod.yml --ref main

      - name: Freshness gate — red run on breached budgets (post-publish)
        # Mirror of the gate in refresh-ca-data.yml: the advisory assert
        # above never blocks the commit; this re-run AFTER commit + deploy
        # fails the run on high-severity breaches so alert-router's
        # consecutive-failure rule escalates within hours on this hourly
        # cron. (The fetch_waves NameError of 2026-05-24 → 2026-07-04
        # class of freeze now reddens the DAILY data workflow instead,
        # since wave moved there in the 2026-07-13 cadence recut.)
        run: python pipeline/check_manifest_freshness.py --layers wind,wind5d --skip-top-level --fail-on high
