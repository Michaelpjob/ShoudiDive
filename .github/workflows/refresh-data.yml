name: Refresh ocean data + deploy

# Pulls fresh SST + chl from NOAA CoastWatch ERDDAP, builds the site,
# and direct-uploads to Cloudflare Pages via wrangler. Also commits the
# refreshed data files so the repo + git history stay in sync.

on:
  schedule:
    # 06:00 UTC daily (~23:00 PT prior day) — after MUR L4 typically publishes.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest ocean data
        # Don't block the deploy on a flaky NOMADS/ERDDAP — the previously
        # committed PNGs in public/data/ are still valid for the build.
        continue-on-error: true
        run: python pipeline/fetch.py

      - name: Fetch latest WaveWatch III
        continue-on-error: true
        run: python pipeline/fetch_waves.py

      - name: Fetch 7-day precipitation (NOAA CPC)
        continue-on-error: true
        run: python pipeline/fetch_precip.py

      - name: Fetch CA river discharge (USGS NWIS)
        continue-on-error: true
        run: python pipeline/fetch_rivers.py

      - name: Fetch CA tide range (NOAA CO-OPS)
        continue-on-error: true
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        # Idempotent: only refetches when the calendar month rolls over.
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Run visibility prediction
        # Runs after the satellite/wave/river/tide/climo fetches so the
        # prediction sees the freshest inputs. Wind PNGs are committed in
        # the wind workflow.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      - name: Install JS dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=main --commit-dirty=true

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
