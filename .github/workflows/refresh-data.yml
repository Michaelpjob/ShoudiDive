name: Refresh ocean data + deploy

# Pulls fresh SST + chl from NOAA CoastWatch ERDDAP, builds the site,
# and direct-uploads to Cloudflare Pages via wrangler. Also commits the
# refreshed data files so the repo + git history stay in sync.

on:
  schedule:
    # 06:00 UTC daily (~23:00 PT prior day) — after MUR L4 typically publishes.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `issues: write` is what the watchdog needs to create the
      # `validation-watchdog` label and open/edit/close the rolling
      # issue. Without it, the Sync step fails with "could not add
      # label: ... not found" because gh label create silently no-ops.
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Flutter SDK setup retired 2026-05-04 — see commit message.
      # Flutter web build was producing a 7 MB bundle at /app/ that
      # had structural mobile rendering issues (foreignObject viewBox
      # bug, slow CanvasKit boot). The React site at / now does the
      # mobile job, so /app/ is no longer worth building. Keeping
      # flutter_app/ in the repo for an eventual native Android
      # build (`flutter build apk` → Play Store) — that path still
      # works, it just doesn't run in CI on every deploy.

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest ocean data
        # Don't block the deploy on a flaky NOMADS/ERDDAP — the previously
        # committed PNGs in public/data/ are still valid for the build.
        # EARTHDATA_TOKEN unlocks NASA OB.DAAC sources for chl_blend.py
        # (AQUA_MODIS, SNPP_VIIRS, S3A_OLCI — all ~1-2 day lag). Without
        # it the chl blender silently falls back to NOAA-only sources
        # (~4 day lag floor).
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch.py

      - name: Fetch latest WaveWatch III
        continue-on-error: true
        run: python pipeline/fetch_waves.py

      - name: Fetch 7-day precipitation (NOAA CPC)
        continue-on-error: true
        run: python pipeline/fetch_precip.py

      - name: Fetch CA river discharge (USGS NWIS)
        continue-on-error: true
        run: python pipeline/fetch_rivers.py

      - name: Fetch CA tide range (NOAA CO-OPS)
        continue-on-error: true
        run: python pipeline/fetch_tides.py

      - name: Fetch surface currents
        # Uses HFR observations where available, then blends tide range,
        # lunar phase, and the committed wind forecast buckets into an
        # explicitly labeled short-horizon surface-current estimate.
        continue-on-error: true
        run: python pipeline/fetch_currents.py

      - name: Refresh climatology if needed
        # Idempotent: only refetches when the calendar month rolls over.
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Assert chl freshness sidecar (PR1)
        # Soft-asserts that fetch.py emitted chl_1d_age_days.png AND
        # wired age_days_url into the manifest. continue-on-error so a
        # flaky NOAA day doesn't block the deploy — the daily watchdog
        # will surface a regression too.
        continue-on-error: true
        run: python -m pipeline.tests.assert_outputs fetch_chl

      - name: Fetch bathymetry (one-shot)
        # Idempotent — fetches GMRT bathy.png the first time CI runs on
        # a clean checkout, then no-ops on every subsequent run because
        # bathy.png will be committed to the repo. Soft-fail so a GMRT
        # outage doesn't block the daily refresh; fetch_visibility falls
        # back to the shelf-from-distance approximation when bathy.png
        # is missing.
        continue-on-error: true
        run: python pipeline/fetch_bathy.py

      - name: Probe all external feeds
        # Reachability + sanity check on every external HTTP source
        # (NASA OB.DAAC, NOAA NOMADS, ERDDAP mirrors, USGS NWIS, NOAA
        # CO-OPS, GMRT, validation-ingest scrapers). Writes
        # pipeline/validation/data/feed_health.json which the watchdog
        # reads. Soft-fail so a single broken feed doesn't block the
        # deploy — fetch scripts have their own retries and fallbacks.
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/check_feeds.py

      - name: Run visibility prediction
        # Runs after the satellite/wave/river/tide/climo fetches so the
        # prediction sees the freshest inputs. Wind PNGs are committed in
        # the wind workflow. Also writes a per-cell archive snapshot to
        # pipeline/validation/data/archive/ for the scoring step below.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      - name: Assert visibility outputs + freshness gating (PR1)
        # Confirms viz_quality.png reflects PR1's freshness gating —
        # i.e. NOT every cell is OBSERVED_1D when there's actual
        # staleness in the chl input. Soft-fail for the same reason
        # as the chl sidecar assertion above.
        continue-on-error: true
        run: python -m pipeline.tests.assert_outputs visibility

      - name: Assert local manifest freshness budgets
        # Final end-to-end gate over the data artifacts this run is about
        # to publish. Soft-fail here so the watchdog issue sync below can
        # publish the exact finding instead of losing it with the runner.
        continue-on-error: true
        run: python pipeline/check_manifest_freshness.py --layers sst,sst7d,sst5d,chl,kd490,wind,wind5d,swell5d,current5d,viz,wave,precip --check-sst-source

      - name: Score visibility predictions against ground-truth
        # Joins observations.jsonl (collected by ingest-ground-truth.yml)
        # against today's archive snapshot, dumps per-zone metrics. Runs
        # in this workflow so the ephemeral archive is still on disk —
        # the gzipped per-cell records are gitignored.
        continue-on-error: true
        run: python -m pipeline.validation.score

      - name: Regression guard — fail build if RMSE jumps >20% in any zone
        # Compares the just-written per_zone_metrics.json against
        # per_zone_metrics_baseline.json. Sleeps until each zone has
        # n >= 30 obs and a baseline exists; until then it's a no-op.
        # Promote a baseline manually once the model is in a state
        # you want to lock against drift:
        #   python -m pipeline.validation.check_regression --promote-baseline
        # Then commit per_zone_metrics_baseline.json.
        run: python -m pipeline.validation.check_regression

      - name: Watchdog — analyse metrics, flag anomalies
        # Reads per_zone_metrics.json, residuals.jsonl, observations.jsonl,
        # and the feed/freshness/ingest health artifacts, then writes
        # pipeline/validation/data/watchdog_summary.md. Exits 1 when any
        # rule fires (which the
        # next step uses to open/update a rolling GitHub Issue), exits
        # 0 otherwise. continue-on-error: the watchdog firing is
        # informational, not a deploy blocker.
        id: watchdog
        continue-on-error: true
        run: python -m pipeline.validation.watchdog

      - name: Sync watchdog GitHub Issue
        # Opens / updates / closes a single rolling Issue tagged
        # `validation-watchdog` based on the watchdog's outcome:
        #   findings    → upsert the issue with the latest summary
        #   no findings → close any open issue
        # The ${{ secrets.GITHUB_TOKEN }} is auto-provided by Actions
        # and has the issues:write scope on this repo only.
        #
        # continue-on-error: this step is purely about surfacing
        # findings to the user. If the GitHub API has a hiccup or a
        # permission misconfig, we don't want it to block the actual
        # deploy. The watchdog's exit-1 already encoded the signal —
        # at worst we lose a notification cycle, not a deploy.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Make sure the label exists. The 2>/dev/null swallows the
          # "already exists" error on subsequent runs.
          gh label create validation-watchdog \
            --color C1880F \
            --description "Auto-managed by pipeline/validation/watchdog.py" \
            2>/dev/null || true

          summary_file=pipeline/validation/data/watchdog_summary.md
          existing=$(gh issue list \
            --label validation-watchdog \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ "${{ steps.watchdog.outcome }}" = "failure" ]; then
            # Findings present — open or update the issue.
            count=$(grep -c '^### ' "$summary_file" || true)
            title="Validation watchdog — ${count} finding(s)"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" \
                --title "$title" \
                --body-file "$summary_file"
              echo "Updated existing watchdog issue #$existing"
            else
              gh issue create \
                --label validation-watchdog \
                --title "$title" \
                --body-file "$summary_file"
              echo "Opened new watchdog issue"
            fi
          else
            # No findings — close any open issue.
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "All findings cleared as of $(date -u +%Y-%m-%dT%H:%MZ)."
              echo "Closed watchdog issue #$existing"
            else
              echo "No watchdog issue open; nothing to close"
            fi
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Run data feature contracts
        run: npm run test:data-contracts

      # The "Build Flutter app (served at /app/)" step that used to live
      # here was retired 2026-05-04. Flutter web at /app/ had structural
      # mobile issues (foreignObject viewBox bug, slow CanvasKit boot,
      # ~7 MB bundle). The React site at / handles mobile via MobileSheet
      # + media-query layout and works fast on phones. Keeping flutter_app/
      # in the repo so we can still ship a native Android build via
      # `flutter build apk` when ready; just not on every deploy.

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=main --commit-dirty=true

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage the prediction PNGs + the validation outputs that we
          # actually want versioned (residuals.jsonl + per_zone_metrics
          # are small and high-signal; the per-cell archive is huge and
          # gitignored). The baseline file is committed manually after
          # `check_regression --promote-baseline`, not auto-overwritten
          # by every refresh.
          git add public/data/
          git add pipeline/validation/data/per_zone_metrics.json \
                  pipeline/validation/data/residuals.jsonl \
                  pipeline/validation/data/watchdog_summary.md \
                  pipeline/validation/data/feed_health.json \
                  pipeline/validation/data/freshness_health.json \
                  pipeline/validation/data/ingest_health.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
