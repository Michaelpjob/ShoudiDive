name: Refresh ocean data + deploy

# Pulls fresh SST + chl from NOAA CoastWatch ERDDAP, builds the site,
# and direct-uploads to Cloudflare Pages via wrangler. Also commits the
# refreshed data files so the repo + git history stay in sync.

on:
  schedule:
    # 06:00 UTC daily (~23:00 PT prior day) — after MUR L4 typically publishes.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest ocean data
        # Don't block the deploy on a flaky NOMADS/ERDDAP — the previously
        # committed PNGs in public/data/ are still valid for the build.
        continue-on-error: true
        run: python pipeline/fetch.py

      - name: Fetch latest WaveWatch III
        continue-on-error: true
        run: python pipeline/fetch_waves.py

      - name: Fetch 7-day precipitation (NOAA CPC)
        continue-on-error: true
        run: python pipeline/fetch_precip.py

      - name: Fetch CA river discharge (USGS NWIS)
        continue-on-error: true
        run: python pipeline/fetch_rivers.py

      - name: Fetch CA tide range (NOAA CO-OPS)
        continue-on-error: true
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        # Idempotent: only refetches when the calendar month rolls over.
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Run visibility prediction
        # Runs after the satellite/wave/river/tide/climo fetches so the
        # prediction sees the freshest inputs. Wind PNGs are committed in
        # the wind workflow. Also writes a per-cell archive snapshot to
        # pipeline/validation/data/archive/ for the scoring step below.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      - name: Score visibility predictions against ground-truth
        # Joins observations.jsonl (collected by ingest-ground-truth.yml)
        # against today's archive snapshot, dumps per-zone metrics. Runs
        # in this workflow so the ephemeral archive is still on disk —
        # the gzipped per-cell records are gitignored.
        continue-on-error: true
        run: python -m pipeline.validation.score

      - name: Regression guard — fail build if RMSE jumps >20% in any zone
        # Compares the just-written per_zone_metrics.json against
        # per_zone_metrics_baseline.json. Sleeps until each zone has
        # n >= 30 obs and a baseline exists; until then it's a no-op.
        # Promote a baseline manually once the model is in a state
        # you want to lock against drift:
        #   python -m pipeline.validation.check_regression --promote-baseline
        # Then commit per_zone_metrics_baseline.json.
        run: python -m pipeline.validation.check_regression

      - name: Watchdog — analyse metrics, flag anomalies
        # Reads per_zone_metrics.json + residuals.jsonl + observations.jsonl,
        # runs four anomaly rules, writes pipeline/validation/data/
        # watchdog_summary.md. Exits 1 when any rule fires (which the
        # next step uses to open/update a rolling GitHub Issue), exits
        # 0 otherwise. continue-on-error: the watchdog firing is
        # informational, not a deploy blocker.
        id: watchdog
        continue-on-error: true
        run: python -m pipeline.validation.watchdog

      - name: Sync watchdog GitHub Issue
        # Opens / updates / closes a single rolling Issue tagged
        # `validation-watchdog` based on the watchdog's outcome:
        #   findings    → upsert the issue with the latest summary
        #   no findings → close any open issue
        # The ${{ secrets.GITHUB_TOKEN }} is auto-provided by Actions
        # and has the issues:write scope on this repo only.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Make sure the label exists. The 2>/dev/null swallows the
          # "already exists" error on subsequent runs.
          gh label create validation-watchdog \
            --color C1880F \
            --description "Auto-managed by pipeline/validation/watchdog.py" \
            2>/dev/null || true

          summary_file=pipeline/validation/data/watchdog_summary.md
          existing=$(gh issue list \
            --label validation-watchdog \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ "${{ steps.watchdog.outcome }}" = "failure" ]; then
            # Findings present — open or update the issue.
            count=$(grep -c '^### ' "$summary_file" || true)
            title="Validation watchdog — ${count} finding(s)"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" \
                --title "$title" \
                --body-file "$summary_file"
              echo "Updated existing watchdog issue #$existing"
            else
              gh issue create \
                --label validation-watchdog \
                --title "$title" \
                --body-file "$summary_file"
              echo "Opened new watchdog issue"
            fi
          else
            # No findings — close any open issue.
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "All findings cleared as of $(date -u +%Y-%m-%dT%H:%MZ)."
              echo "Closed watchdog issue #$existing"
            else
              echo "No watchdog issue open; nothing to close"
            fi
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=main --commit-dirty=true

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage the prediction PNGs + the validation outputs that we
          # actually want versioned (residuals.jsonl + per_zone_metrics
          # are small and high-signal; the per-cell archive is huge and
          # gitignored). The baseline file is committed manually after
          # `check_regression --promote-baseline`, not auto-overwritten
          # by every refresh.
          git add public/data/
          git add pipeline/validation/data/per_zone_metrics.json \
                  pipeline/validation/data/residuals.jsonl \
                  pipeline/validation/data/watchdog_summary.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
