name: Refresh fleet tracks (AIS, on demand)

# Rebuilds the Fleet Tracks tool data (public/fleet/data.json) from the public
# NOAA/USCG daily AIS archive for a date window, plus the landings' posted dock
# counts, and commits the result to the branch it was dispatched on.
#
# On demand only: the archive is published about two months in arrears and a
# season window is ~40 GB of national day files (streamed, filtered to SoCal,
# deleted; ~10 MB/day kept). A window of 150 days takes about an hour on a
# standard runner. The filtered SoCal cut is kept in the Actions cache keyed
# by window so a re-run with a tweaked model is minutes, not an hour.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day (YYYY-MM-DD)"
        required: true
        default: "2025-06-01"
      end:
        description: "Last day (YYYY-MM-DD); days not yet published are skipped"
        required: true
        default: "2025-10-31"
      branch:
        description: "Branch to commit data.json to"
        required: true
        default: "dev"

concurrency:
  group: refresh-fleet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FLEET_DATA_DIR: ${{ github.workspace }}/.fleet-data
      PYTHONIOENCODING: utf-8
      # Inputs reach the shell as environment variables, never interpolated
      # into `run:` text (semgrep run-shell-injection).
      WIN_START: ${{ inputs.start }}
      WIN_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fleet-model/requirements.txt

      - name: Install model dependencies
        run: pip install -r fleet-model/requirements.txt

      - name: Restore the filtered SoCal AIS cut + dock-count cache
        uses: actions/cache@0400d5f644dc74513d0c1f4b2d5a0bc9b4ff8a6a # v4
        with:
          path: |
            .fleet-data/socal
            .fleet-data/counts
          key: fleet-ais-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: fleet-ais-

      - name: Fetch + reduce the daily AIS files (skips days already cut)
        run: python fleet-model/fetch_ais.py --start "$WIN_START" --end "$WIN_END" --workers 4

      - name: Fleet lists (checked in copy)
        run: cp fleet-model/data/roster_web.json "$FLEET_DATA_DIR/roster_web.json"

      - name: Live days from the fleet-live branch (fills the archive's lag)
        run: |
          if git ls-remote --exit-code --heads origin fleet-live >/dev/null 2>&1; then
            git fetch --depth=1 origin fleet-live
            git worktree add "$FLEET_DATA_DIR/live-branch" FETCH_HEAD
            mkdir -p "$FLEET_DATA_DIR/live"
            cp "$FLEET_DATA_DIR"/live-branch/live/*.jsonl "$FLEET_DATA_DIR/live/" 2>/dev/null || true
            python fleet-model/live_logger.py --roll-all
          else
            echo "no fleet-live branch yet"
          fi

      - name: Roster, dock counts, model
        run: |
          python fleet-model/roster.py --start "$WIN_START" --end "$WIN_END"
          python fleet-model/catch.py --start "$WIN_START" --end "$WIN_END"
          python fleet-model/build_site.py public/fleet --start "$WIN_START" --end "$WIN_END"

      - name: Commit refreshed data.json + roster
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fleet/data.json fleet-model/data/roster.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "data(fleet): rebuild $WIN_START..$WIN_END"
            git push
          fi
