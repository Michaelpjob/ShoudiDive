name: Refresh Sentinel-2 kelp (current canopy)

# Biweekly: refresh the Sentinel-2 CURRENT-canopy sidecar
# (paddies-model/data/sentinel2_kelp_scb.json) that the Kelp Paddy Finder blends
# onto the slow quarterly Landsat 3-yr-peak baseline. Sentinel-2 is free, ~5-day
# revisit, 10 m, reached with NO auth via the Element84 earth-search STAC + the
# public AWS sentinel-cogs COG bucket (deep-research adjudicated, run wb11wiaov).
# The daily paddy build reads whatever sidecar is committed here; the blend is
# gentle + gated (kelp_source._blend_sentinel2), so a stale/missing sidecar
# degrades gracefully to pure Landsat. Biweekly matches the cloud-limited,
# ~2-4 wk real-change cadence (a single scene is noisy; the fetch composites the
# recent max + tide-filters). Cadence is intentionally modest: SoCal "June Gloom"
# marine layer can cloud a bed out for a full month.

on:
  schedule:
    - cron: "0 10 4,18 * *"   # 10:00 UTC, 4th + 18th of each month (~biweekly)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-kelp-sentinel2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: paddies-model/requirements.txt
      - name: Install paddy-model dependencies
        run: pip install -r paddies-model/requirements.txt
      - name: Fetch Sentinel-2 current canopy (STAC + public AWS COGs, no auth)
        # fetch_kelp_sentinel2.py raises SystemExit(2) if 0 cells are covered,
        # so a total data outage fails the run loudly instead of committing empty.
        run: python paddies-model/fetch_kelp_sentinel2.py
      - name: Commit refreshed Sentinel-2 sidecar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paddies-model/data/sentinel2_kelp_scb.json
          if git diff --staged --quiet; then
            echo "Sentinel-2 sidecar unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "data(paddies): refresh Sentinel-2 current-canopy sidecar"
          git push
