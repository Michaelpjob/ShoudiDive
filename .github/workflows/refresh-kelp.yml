name: Refresh Landsat kelp extract

# Quarterly: pull the newest revision of the SBC LTER "Kelp from Landsat"
# dataset (EDI knb-lter-sbc.74, ~2.6 GB) and re-extract the compact
# CA+Baja file (pipeline/data/landsat_kelp_ca.nc, ~1 MB) that the spot
# bundle builder reads for the spots CDFW doesn't cover (Coronados/Baja,
# NorCal bull kelp, the islands CDFW timed out on). Keeping this extract
# fresh means every subsequent spot-bundle rebuild draws current canopy
# without a 2.6 GB download in the daily pipeline.

on:
  schedule:
    - cron: "0 8 5 1,4,7,10 *"   # 08:00 UTC, 5th of Jan / Apr / Jul / Oct
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-kelp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Fetch + extract latest Landsat kelp (knb-lter-sbc.74)
        run: python pipeline/fetch_kelp_landsat.py
      - name: Commit refreshed extract
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/landsat_kelp_ca.nc
          if git diff --staged --quiet; then
            echo "Landsat kelp extract unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "data: refresh Landsat kelp extract (SBC LTER knb-lter-sbc.74)"
          git push
