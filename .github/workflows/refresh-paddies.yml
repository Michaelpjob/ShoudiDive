name: Refresh paddies (kelp-drift, daily)

# Daily refresh of the Kelp Paddy Finder (public/paddies/data.json). Runs the
# kelp-drift model in paddies-model/ — it drifts recently-shed kelp cohorts
# forward on HFRNet 6 km observed currents + Open-Meteo fill, promotes the live
# crowd catch-reports, and regenerates the -3..+2 day frames (historical -> today
# -> forecast) against the real "today". Commits data.json to main and fires the
# prod deploy, so the tool self-updates like the rest of the site instead of
# serving a hand-built snapshot.
#
# Model inputs are all public HTTP (NDBC THREDDS, Open-Meteo, shouldidive.com
# reports/chl) + local dive-spot bundles, so it runs self-contained in CI.

on:
  schedule:
    - cron: "30 9 * * *"   # after the 06:00 UTC data refresh + deploy have landed
  workflow_dispatch:

concurrency:
  group: refresh-paddies
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write   # for `gh workflow run deploy-prod.yml`

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: paddies-model/requirements.txt

      - name: Install model dependencies
        run: pip install -r paddies-model/requirements.txt

      - name: Run kelp-drift model -> public/paddies/data.json
        # Fetches HFRNet 6 km currents (NDBC THREDDS via pydap) + Open-Meteo +
        # the live crowd reports (degrades to physics-only if reports are down).
        # ~5 min on a healthy day. NOT continue-on-error: a hard failure (e.g.
        # HFRNet down) should fail the run rather than commit a stale snapshot.
        timeout-minutes: 15
        env:
          PADDIES_LOCAL_DATA: ${{ github.workspace }}/public
        run: python paddies-model/build_site.py "public/paddies"

      - name: Sentinel — data.json must be today's build
        # Belt-and-suspenders: even if the model exits 0 with a silently-cached
        # frame, refuse to commit unless build_utc is actually today.
        run: |
          python -c "import json,datetime; d=json.load(open('public/paddies/data.json')); b=d['model_meta']['build_utc'][:10]; t=datetime.datetime.utcnow().strftime('%Y-%m-%d'); assert b==t, f'data.json build_utc {b} != today {t}'; print('ok: data.json built', b)"

      - name: Commit refreshed data.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/paddies/data.json
          if git diff --staged --quiet; then
            echo "No change in data.json."
          else
            git commit -m "data(paddies): daily refresh $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push failed (attempt $attempt) — rebasing"
              git pull --rebase --autostash origin main
            done
          fi

      - name: Trigger production deploy
        # Pushes by the default GITHUB_TOKEN don't fire downstream workflows;
        # dispatch deploy-prod explicitly so the fresh data.json publishes.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-prod.yml --ref main
