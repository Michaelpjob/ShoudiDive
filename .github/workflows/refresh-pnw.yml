name: Refresh PNW

# Pacific Northwest — daily 06:30 UTC. Full pipeline writes to
# public/data/pnw/ and deploys to pnw-beta.shouldidive.pages.dev
# (Cloudflare Pages preview branch within the same project as prod).
#
# Cannot touch shouldidive.com:
#   1. SHOULDIDIVE_REGION=pnw, so fetchers write to /data/pnw/
#   2. Wrangler step uses --branch=pnw-beta, not --branch=main
#   3. The CA-only validation steps are skipped (no observations yet)
#
# Schedule fires against `dev` by default — staging surface for PNW.
# workflow_dispatch lets you point at main once PNW reaches feature
# parity and you want pnw-beta.shouldidive.pages.dev to track prod
# instead of dev.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: dev for staging)"
        required: false
        default: "dev"
        type: string

concurrency:
  group: refresh-pnw
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: pnw
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'dev' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # ---- Fetch all PNW data sources --------------------------------

      - name: Fetch latest ocean data (SST, chl, kd490)
        continue-on-error: true
        timeout-minutes: 15
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch.py

      - name: Fetch WaveWatch III
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_waves.py

      - name: Fetch 7-day precipitation (NOAA CPC)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_precip.py

      - name: Fetch river discharge (CA-station list today, no-op for PNW until PR-PNW-3)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_rivers.py

      - name: Fetch tide range (CA-station list today, no-op for PNW)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Fetch bathymetry (one-shot)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_bathy.py

      - name: Fetch coastline (one-shot, bbox-locked)
        continue-on-error: true
        timeout-minutes: 8
        run: python pipeline/fetch_coastline.py

      - name: Fetch MPA boundaries (CDFW source — empty for PNW until PR-PNW-4)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_mpa.py

      - name: Fetch wind (HRRR — full PNW coverage)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_wind_5day.py

      - name: Fetch 5-day hourly swell
        continue-on-error: true
        timeout-minutes: 10
        run: python pipeline/fetch_swell_5day.py

      - name: Fetch surface currents (HFRNet sparse in PNW; model-inference fallback)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_currents.py

      - name: Probe all external feeds
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/check_feeds.py

      # ---- Derived layers --------------------------------------------

      - name: Run 5-day SST forecast
        continue-on-error: true
        run: python pipeline/fetch_sst_5day.py

      - name: Run visibility prediction
        # PR-PNW-3 will introduce the pnw_inland viz variant for Salish
        # Sea. Until then PNW viz uses the chl-based model calibrated
        # for CA — predictions are not yet trustworthy for the Salish.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      # ---- Build + deploy + commit -----------------------------------

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (pnw-beta)
        # Preview branch within the shouldidive Cloudflare project.
        # Cloudflare auto-serves at pnw-beta.shouldidive.pages.dev.
        # CANNOT affect shouldidive.com — wrong --branch value, and
        # the production branch (main) is locked to refresh-ca.yml.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=pnw-beta --commit-dirty=true

      - name: Commit refreshed PNW data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only PNW data lives under public/data/pnw/ — staging that
          # tree exclusively means a PNW refresh cannot accidentally
          # commit a CA-data delta if some shared file got touched.
          git add public/data/pnw/
          if git diff --staged --quiet; then
            echo "No PNW data changes to commit."
          else
            git commit -m "data: refresh pnw $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push failed (attempt $attempt) — pulling rebase and retrying"
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi
