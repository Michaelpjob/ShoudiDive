name: Refresh tropical — data (daily)

# Florida + Gulf + Caribbean — DAILY data refresh at 07:00 UTC.
# Writes to public/data/tropical/ and deploys to
# tropical-beta.shouldidive.pages.dev (Cloudflare preview branch —
# wrangler --branch=tropical-beta cannot reach shouldidive.com).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: dev)"
        required: false
        default: "dev"
        type: string
      force_climo:
        description: "Force-rebuild sst_climo.png even if the cached month matches (use after fixing climo encoding bugs)"
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-tropical-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: tropical
    permissions:
      contents: write
      actions: write   # for `gh workflow run deploy-tropical-beta.yml` at the end

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'dev' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest ocean data (SST, chl, kd490)
        # 2026-05-17: bumped 15 → 35 min, mirrors refresh-ca-data.yml.
        # Tropical has a very wide bbox (-98 to -60 lng) — needs the
        # bigger budget more than CA does.
        continue-on-error: true
        timeout-minutes: 35
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch.py

      - name: Sentinel — fail loudly if ocean fetch produced no fresh output
        # See refresh-ca-data.yml for the full rationale. SHOULDIDIVE_REGION
        # is inherited from the job env, so the sentinel looks at
        # public/data/tropical/ automatically.
        run: python pipeline/check_fetch_freshness.py --layer sst

      - name: Fetch 7-day precipitation
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch_precip.py

      - name: Fetch river discharge (no-op for tropical — CA stations only)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_rivers.py

      - name: Fetch tide range (no-op for tropical — CA CO-OPS only)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        continue-on-error: true
        run: |
          if [ "${{ inputs.force_climo }}" = "true" ]; then
            python pipeline/fetch_climatology.py --force
          else
            python pipeline/fetch_climatology.py
          fi

      - name: Fetch bathymetry (one-shot)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_bathy.py

      - name: Fetch coastline (one-shot)
        continue-on-error: true
        timeout-minutes: 8
        run: python pipeline/fetch_coastline.py

      - name: Fetch MPA boundaries (empty for tropical until PR-TROP-6)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_mpa.py

      - name: Probe all external feeds
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/check_feeds.py

      - name: Run 5-day SST forecast
        continue-on-error: true
        run: python pipeline/fetch_sst_5day.py

      - name: Run visibility prediction
        # PR-TROP-5 introduces subtractive_tropical viz model — until
        # then the chl-based CA model runs against tropical (oligotrophic)
        # water and predicts ~100ft viz everywhere. Known wrong.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      - name: Fetch RTOFS ocean-model forecast (tropical only)
        # Pulls NOAA RTOFS Global 2ds prog NetCDFs from NOMADS for
        # forecast leads +1d / +3d / +5d / +7d. ~620 MB transfer.
        # Adds parallel SST forecast track + surface currents for
        # the Caribbean basin (where HFRNet has zero coverage).
        # 25-minute timeout is generous: NOMADS streams ~155 MB
        # files in 1-2 min each on a healthy day.
        continue-on-error: true
        timeout-minutes: 25
        run: python pipeline/fetch_rtofs.py

      # Build + deploy steps were removed 2026-05-13 — data-only flow.
      # deploy-tropical-beta.yml (triggered below) handles the publish.

      - name: Sentinel — fail if SST/chl/wind PNGs unchanged from HEAD
        # See refresh-ca-data.yml for the full rationale.
        run: python pipeline/check_data_changed.py

      - name: Commit refreshed tropical data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/tropical/
          if git diff --staged --quiet; then
            echo "No tropical data changes to commit."
          else
            git commit -m "data: refresh tropical $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push failed (attempt $attempt) — rebasing"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi

      - name: Trigger tropical-beta deploy
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-tropical-beta.yml --ref dev
