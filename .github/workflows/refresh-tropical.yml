name: Refresh tropical

# Florida + Gulf + Caribbean — daily 07:00 UTC. Full pipeline writes
# to public/data/tropical/ and deploys to
# tropical-beta.shouldidive.pages.dev (Cloudflare Pages preview
# branch within the same project as prod).
#
# Cannot touch shouldidive.com:
#   1. SHOULDIDIVE_REGION=tropical, so fetchers write to /data/tropical/
#   2. Wrangler step uses --branch=tropical-beta, not --branch=main
#   3. CA-only validation steps skipped
#
# Schedule fires against `dev` by default. PR-TROP-5 (subtractive viz
# model) needs to land before this region can have trustworthy viz
# predictions — see docs/expansion-regions.md § 3.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to refresh against (default: dev for staging)"
        required: false
        default: "dev"
        type: string

concurrency:
  group: refresh-tropical
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHOULDIDIVE_REGION: tropical
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || (github.event_name == 'schedule' && 'dev' || github.ref) }}
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # ---- Fetch all tropical data sources ---------------------------

      - name: Fetch latest ocean data (SST, chl, kd490)
        continue-on-error: true
        timeout-minutes: 15
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch.py

      - name: Fetch WaveWatch III
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_waves.py

      - name: Fetch 7-day precipitation (NOAA CPC — global coverage)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_precip.py

      - name: Fetch river discharge (no-op for tropical — CA stations only)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_rivers.py

      - name: Fetch tide range (no-op for tropical — CA CO-OPS stations only)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_tides.py

      - name: Refresh climatology if needed
        continue-on-error: true
        run: python pipeline/fetch_climatology.py

      - name: Fetch bathymetry (one-shot)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_bathy.py

      - name: Fetch coastline (one-shot, bbox-locked)
        continue-on-error: true
        timeout-minutes: 8
        run: python pipeline/fetch_coastline.py

      - name: Fetch MPA boundaries (empty for tropical — CDFW is CA-only)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_mpa.py

      - name: Fetch wind (HRRR — partial coverage; Caribbean south of ~22N misses)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_wind_5day.py

      - name: Fetch 5-day hourly swell
        continue-on-error: true
        timeout-minutes: 10
        run: python pipeline/fetch_swell_5day.py

      - name: Fetch surface currents (HFRNet has zero Caribbean — fallback only)
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/fetch_currents.py

      - name: Probe all external feeds
        continue-on-error: true
        timeout-minutes: 5
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/check_feeds.py

      # ---- Derived layers --------------------------------------------

      - name: Run 5-day SST forecast
        continue-on-error: true
        run: python pipeline/fetch_sst_5day.py

      - name: Run visibility prediction
        # PR-TROP-5 will introduce subtractive_tropical viz. Until then
        # this runs the chl-based CA model which is the wrong shape
        # for tropical water (oligotrophic) — predictions unreliable.
        continue-on-error: true
        run: python pipeline/fetch_visibility.py

      # ---- Build + deploy + commit -----------------------------------

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (tropical-beta)
        # Preview branch within the shouldidive Cloudflare project.
        # Cloudflare auto-serves at tropical-beta.shouldidive.pages.dev.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=tropical-beta --commit-dirty=true

      - name: Commit refreshed tropical data
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/tropical/
          if git diff --staged --quiet; then
            echo "No tropical data changes to commit."
          else
            git commit -m "data: refresh tropical $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push failed (attempt $attempt) — pulling rebase and retrying"
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            done
          fi
