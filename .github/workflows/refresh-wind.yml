name: Refresh wind + deploy

# Pulls fresh 10-m wind from NOAA HRRR via NOMADS, builds the site, and
# uploads to Cloudflare Pages via wrangler. Runs hourly to pick up the
# freshest extended HRRR run (00/06/12/18z).

on:
  schedule:
    # Every hour at :15 — gives NOMADS a buffer to publish the freshest run.
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  refresh-wind:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # cfgrib needs eccodes; the wheel bundles it on Linux.
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest wind (HRRR now/+6h/+24h)
        # Don't block the deploy on a flaky NOMADS — the previously
        # committed wind PNGs in public/data/ are still valid for the build.
        continue-on-error: true
        run: python pipeline/fetch_wind.py

      - name: Fetch 5-day hourly wind (HRRR f00-f48 + GFS f49-f120)
        # New 5-day × 5-bucket forecast structure for the upcoming wind UI.
        # Pulls 121 hourly UV slices (~1.5 GB total over the wire), so it's
        # the heavy step in the cycle. continue-on-error keeps the deploy
        # alive if NOMADS is having a moment.
        continue-on-error: true
        run: python pipeline/fetch_wind_5day.py

      - name: Fetch 5-day hourly swell (gfswave f00-f120)
        # WaveWatch III via gfswave wcoast 0.16°. Same byte-range trick;
        # 121 small GRIB extracts. New gfswave runs every 6h, so the
        # hourly cron mostly hits the .grib2 cache. Output: per-day ×
        # per-bucket Hs/Tp/Dp PNGs + swell/summary.json.
        continue-on-error: true
        run: python pipeline/fetch_swell_5day.py

      - name: Install JS dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shouldidive --branch=main --commit-dirty=true

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "wind: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
