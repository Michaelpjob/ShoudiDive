name: Sync dev with main

# When main moves (cron data commits, PR merges, etc.), automatically
# fast-forward / merge `dev` so any open dev → main PR doesn't go DIRTY.
#
# Problem this solves:
# ---------------------
# Two pipelines write to `main`:
#   * Code pipeline:   agent → dev → PR → main      (slow, gated)
#   * Data pipeline:   cron  →            main      (every ~hour)
#
# Both touch overlapping paths (`public/data/*`). Every cron push to
# main creates a guaranteed merge conflict against any open dev → main
# PR, blocking the GitHub merge button until dev is rebased. Before
# this workflow, that meant a manual "merge main into dev, take main's
# data, push" dance after every cron push — making it nearly impossible
# to land code PRs during business hours.
#
# How this works:
# ---------------
# 1. Trigger: any push to main.
# 2. Skip if the push WAS this workflow's own merge commit (no loop).
# 3. Skip if dev is already at or ahead of main (nothing to sync).
# 4. Otherwise: merge main into dev with `-X theirs` so any conflicts
#    on `public/data/*` resolve to main's (newer) version automatically.
# 5. Push back to dev.
#
# Why `-X theirs` is safe here:
# -----------------------------
# Conflicts in our setup are essentially always on data files. Per
# CLAUDE.md, nothing pushes code-changes directly to main — they all
# come via dev → main PRs, so by the time main's commit reaches this
# workflow, dev's version of any code file is either identical or
# already merged in. The only commits hitting main that this workflow
# reacts to are the cron data commits, which by construction touch
# only data files. `-X theirs` resolves those to main's bot output;
# code conflicts would be a sign something has gone wrong upstream
# and should fail loudly anyway.
#
# Long-term: data files shouldn't live in git at all (move to R2).
# This workflow is the pragmatic bridge until that refactor lands.

on:
  push:
    branches: [main]
  # Manual escape hatch — lets an operator force a sync without
  # waiting for the next bot push to main.
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # degraded-mode fallback opens a rolling tracking Issue

concurrency:
  group: sync-dev
  # If a new main push arrives mid-sync, cancel the in-flight run and
  # restart against the newer main HEAD. We only care about the latest.
  cancel-in-progress: true

jobs:
  sync:
    # Only react to bot-driven main pushes (cron data/wind refreshes).
    #
    # Caveat about `github.actor`: the cron workflows push using
    # BOT_PUSH_TOKEN (a user PAT, to bypass branch protection), which
    # makes `github.actor` resolve to the PAT owner — NOT the bot —
    # even though the COMMIT was authored by github-actions[bot].
    # That's why we check `head_commit.author.email` here: it reflects
    # who AUTHORED the commit, independent of who pushed it.
    #
    # PR merge commits land with the user's email and skip the sync
    # (correct: dev was just consumed by the merge). Direct human
    # pushes to main are emergency scenarios — let those surface
    # normally rather than silently fan out to dev.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.author.email, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: dev
          fetch-depth: 0
          # BOT_PUSH_TOKEN (user PAT), NOT GITHUB_TOKEN — two reasons:
          # 1. Syncs that carry .github/workflows/** changes from main
          #    (any CI fix) are REJECTED for GITHUB_TOKEN ("refusing to
          #    allow a GitHub App to ... update workflow ... without
          #    `workflows` permission"). Seen live 2026-06-12 on the
          #    first sync after the stabilization merge.
          # 2. PAT pushes trigger downstream workflows, so a sync that
          #    brings code to dev fires dev-checks (and the dev preview
          #    deploy chain) natively — no explicit dispatch step
          #    needed. Data-only syncs are filtered by dev-checks'
          #    paths-ignore.
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Check whether dev needs sync
        id: check
        run: |
          git fetch origin main
          ahead=$(git rev-list dev..origin/main --count)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "pre_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$ahead" = "0" ]; then
            echo "dev already up to date with main — nothing to do"
          else
            echo "dev is $ahead commit(s) behind main — will sync"
          fi

      - name: Merge main into dev (prefer main's data files)
        if: steps.check.outputs.ahead != '0'
        run: |
          # -X theirs: when conflicts arise on file content, prefer the
          # incoming side (main). For data files (the only realistic
          # conflict surface), main is always newer + correct.
          git merge origin/main \
            --no-edit \
            -X theirs \
            -m "sync(auto): bring dev up to main HEAD"

      - name: Align main-owned data with main (coherence pass)
        if: steps.check.outputs.ahead != '0'
        id: align
        run: |
          # -X theirs resolves CONFLICTS to main, but hunks that only
          # dev touched survive the merge — and two bots write the same
          # files on the two branches (main: refresh-ca-*; dev: the
          # ca-beta refreshes, which share public/data/ by design).
          # A hunk-level mix of the two produced a manifest whose SST
          # grid said 586×511 while sst_1d.png was 234×206 (#137):
          # manifest + PNGs MUST move as one atomic set, which no
          # hunk-level merge can guarantee. So after every sync, the
          # MAIN-OWNED data paths are reset wholesale to main's
          # coherent set. The ca-beta refreshes re-assert dev's own
          # (equally coherent) set on their next run; what's banned is
          # the mix.
          #
          # Ownership map (who refreshes where — keep in lockstep with
          # the `ref:` line in each refresh-<region>-data.yml):
          #   main-owned: public/data/ flat files + baja/ (prod regions
          #               ca + baja refresh on main)
          #   dev-owned:  public/data/pnw/ + public/data/tropical/
          #               (beta regions refresh on dev; main's copies
          #               LAG — resetting them from main would clobber
          #               fresh beta data with weeks-stale copies)
          DEV_OWNED_SUBDIRS="pnw tropical"

          git checkout origin/main -- public/data/
          for sub in $DEV_OWNED_SUBDIRS; do
            if git rev-parse -q --verify "${{ steps.check.outputs.pre_sha }}:public/data/$sub" >/dev/null; then
              git checkout "${{ steps.check.outputs.pre_sha }}" -- "public/data/$sub/"
            fi
          done
          if git diff --cached --quiet; then
            echo "public/data already coherent with main"
            echo "data_realigned=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync(auto): align main-owned data with main (atomic manifest+PNG set)"
            echo "data_realigned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced dev
        if: steps.check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # Happy path: push everything (data + code + workflow files).
          if git push origin dev 2>push.log; then
            cat push.log
            echo "Synced dev (full push)."
            # Recovered: clear any open degraded-mode tracking Issue.
            num=$(gh issue list --repo "$REPO" \
              --label "system:dev-sync-degraded" --state open --limit 1 \
              --json number --jq '.[0].number // empty' || true)
            if [ -n "$num" ]; then
              gh issue close "$num" --repo "$REPO" \
                --comment "Full sync (including workflow files) succeeded — degraded mode cleared. Auto-closed by sync-dev.yml." \
                || true
            fi
            exit 0
          fi
          cat push.log

          # KNOWN DEGRADED MODE — the cause of the 2026-06-24..30 freeze.
          # BOT_PUSH_TOKEN is a user PAT, and GitHub refuses to let a PAT
          # *without* the `workflow` scope create/update files under
          # .github/workflows/**. When main carries a workflow change the
          # WHOLE push — including the fresh DATA riding with it — is
          # rejected, and dev silently freezes. Rather than freeze, drop
          # ONLY the workflow delta and re-push data + code so dev DATA
          # stays fresh (deploy-dev's data-path trigger then redeploys
          # the site), and raise a visible rolling Issue so the held-back
          # workflows get noticed. PERMANENT FIX: add the `workflow`
          # scope to BOT_PUSH_TOKEN.
          if grep -qiE "workflow.*scope|without .?workflow" push.log; then
            echo "::warning::BOT_PUSH_TOKEN lacks the 'workflow' scope — pushing data+code only; dev workflow files held back. Re-scope the PAT to restore full sync."
            git checkout "${{ steps.check.outputs.pre_sha }}" -- .github/workflows/
            if git diff --cached --quiet; then
              echo "::error::Push rejected for workflow scope but no workflow delta to drop — failing loudly."
              exit 1
            fi
            git commit -m "sync(auto): data+code only — BOT_PUSH_TOKEN lacks 'workflow' scope; dev workflow files NOT updated (re-scope the PAT to fix)"
            git push origin dev

            title="[dev-sync degraded] BOT_PUSH_TOKEN missing 'workflow' scope"
            body=$(printf '%s\n' \
              "The main→dev sync is running in **degraded mode**: data and code reach \`dev\`, but **workflow-file changes do not**, because \`BOT_PUSH_TOKEN\` is a PAT without the \`workflow\` scope." \
              "" \
              "**Impact:** dev DATA stays fresh, but \`dev\`'s \`.github/workflows/**\` lag \`main\`. If a *tested* workflow (e.g. refresh-ca-data.yml's coverage guard) changes, Dev checks can go red and stop deploying the dev preview." \
              "" \
              "**Permanent fix:** add the \`workflow\` scope to \`BOT_PUSH_TOKEN\` (GitHub → Settings → Developer settings → Personal access tokens → that token → enable \`workflow\`), then re-save it as the repo secret if the value changed." \
              "" \
              "Auto-managed by .github/workflows/sync-dev.yml — closes itself once a full sync succeeds.")
            gh label create system:dev-sync-degraded --repo "$REPO" \
              --color "B45309" \
              --description "main→dev sync running without the workflow PAT scope" \
              2>/dev/null || true
            existing=$(gh issue list --repo "$REPO" \
              --label "system:dev-sync-degraded" --state open --limit 1 \
              --json number --jq '.[0].number // empty' || true)
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$REPO" --title "$title" --body "$body" || true
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body" \
                --label "system:dev-sync-degraded" || true
            fi
            exit 0
          fi

          echo "::error::Sync push to dev failed for a reason other than workflow scope — see push.log above."
          exit 1

      # (No dev-checks dispatch step: the BOT_PUSH_TOKEN push above
      # triggers workflows natively. dev-checks' paths-ignore keeps
      # data-only syncs from burning runs; code syncs gate + deploy
      # the dev preview through the normal push-event path.)

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sync dev result"
            echo
            if [ "${{ steps.check.outputs.ahead }}" = "0" ]; then
              echo "Dev was already up to date with main. No-op."
            else
              echo "Merged ${{ steps.check.outputs.ahead }} main commit(s) into dev."
              echo "Open dev → main PRs should flip back to MERGEABLE within seconds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
