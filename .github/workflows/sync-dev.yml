name: Sync dev with main

# When main moves (cron data commits, PR merges, etc.), automatically
# fast-forward / merge `dev` so any open dev → main PR doesn't go DIRTY.
#
# Problem this solves:
# ---------------------
# Two pipelines write to `main`:
#   * Code pipeline:   agent → dev → PR → main      (slow, gated)
#   * Data pipeline:   cron  →            main      (every ~hour)
#
# Both touch overlapping paths (`public/data/*`). Every cron push to
# main creates a guaranteed merge conflict against any open dev → main
# PR, blocking the GitHub merge button until dev is rebased. Before
# this workflow, that meant a manual "merge main into dev, take main's
# data, push" dance after every cron push — making it nearly impossible
# to land code PRs during business hours.
#
# How this works:
# ---------------
# 1. Trigger: any push to main.
# 2. Skip if the push WAS this workflow's own merge commit (no loop).
# 3. Skip if dev is already at or ahead of main (nothing to sync).
# 4. Otherwise: merge main into dev with `-X theirs` so any conflicts
#    on `public/data/*` resolve to main's (newer) version automatically.
# 5. Push back to dev.
#
# Why `-X theirs` is safe here:
# -----------------------------
# Conflicts in our setup are essentially always on data files. Per
# CLAUDE.md, nothing pushes code-changes directly to main — they all
# come via dev → main PRs, so by the time main's commit reaches this
# workflow, dev's version of any code file is either identical or
# already merged in. The only commits hitting main that this workflow
# reacts to are the cron data commits, which by construction touch
# only data files. `-X theirs` resolves those to main's bot output;
# code conflicts would be a sign something has gone wrong upstream
# and should fail loudly anyway.
#
# Long-term: data files shouldn't live in git at all (move to R2).
# This workflow is the pragmatic bridge until that refactor lands.

on:
  push:
    branches: [main]

permissions:
  contents: write
  # actions: write is needed for the final step where we dispatch
  # dev-checks.yml against the freshly-synced dev HEAD. Without it,
  # the GH api call fails with "Resource not accessible by integration".
  actions: write

concurrency:
  group: sync-dev
  # If a new main push arrives mid-sync, cancel the in-flight run and
  # restart against the newer main HEAD. We only care about the latest.
  cancel-in-progress: true

jobs:
  sync:
    # Only react to bot-driven main pushes (cron data/wind refreshes).
    #
    # Caveat about `github.actor`: the cron workflows push using
    # BOT_PUSH_TOKEN (a user PAT, to bypass branch protection), which
    # makes `github.actor` resolve to the PAT owner — NOT the bot —
    # even though the COMMIT was authored by github-actions[bot].
    # That's why we check `head_commit.author.email` here: it reflects
    # who AUTHORED the commit, independent of who pushed it.
    #
    # PR merge commits land with the user's email and skip the sync
    # (correct: dev was just consumed by the merge). Direct human
    # pushes to main are emergency scenarios — let those surface
    # normally rather than silently fan out to dev.
    if: contains(github.event.head_commit.author.email, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          # GITHUB_TOKEN can push to dev — dev isn't branch-protected.
          # Caveat: pushes via GITHUB_TOKEN don't trigger downstream
          # workflows (a GH safety feature to prevent recursion).
          # 2026-05-24: this used to be flagged as "fine, we don't need
          # dev-checks to re-run on a pure data-file sync". That was
          # wrong. When an open dev → main PR exists, branch protection
          # requires green status checks on the CURRENT head of dev.
          # A sync commit changes the head SHA, so the PR's required
          # checks no longer point at a checked commit, and the merge
          # is BLOCKED until something dispatches dev-checks against
          # the new HEAD. The final step in this job now does that
          # explicitly via `gh workflow run`.

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Check whether dev needs sync
        id: check
        run: |
          git fetch origin main
          ahead=$(git rev-list dev..origin/main --count)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "pre_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$ahead" = "0" ]; then
            echo "dev already up to date with main — nothing to do"
          else
            echo "dev is $ahead commit(s) behind main — will sync"
          fi

      - name: Merge main into dev (prefer main's data files)
        if: steps.check.outputs.ahead != '0'
        run: |
          # -X theirs: when conflicts arise on file content, prefer the
          # incoming side (main). For data files (the only realistic
          # conflict surface), main is always newer + correct.
          git merge origin/main \
            --no-edit \
            -X theirs \
            -m "sync(auto): bring dev up to main HEAD"

      - name: Align main-owned data with main (coherence pass)
        if: steps.check.outputs.ahead != '0'
        id: align
        run: |
          # -X theirs resolves CONFLICTS to main, but hunks that only
          # dev touched survive the merge — and two bots write the same
          # files on the two branches (main: refresh-ca-*; dev: the
          # ca-beta refreshes, which share public/data/ by design).
          # A hunk-level mix of the two produced a manifest whose SST
          # grid said 586×511 while sst_1d.png was 234×206 (#137):
          # manifest + PNGs MUST move as one atomic set, which no
          # hunk-level merge can guarantee. So after every sync, the
          # MAIN-OWNED data paths are reset wholesale to main's
          # coherent set. The ca-beta refreshes re-assert dev's own
          # (equally coherent) set on their next run; what's banned is
          # the mix.
          #
          # Ownership map (who refreshes where — keep in lockstep with
          # the `ref:` line in each refresh-<region>-data.yml):
          #   main-owned: public/data/ flat files + baja/ (prod regions
          #               ca + baja refresh on main)
          #   dev-owned:  public/data/pnw/ + public/data/tropical/
          #               (beta regions refresh on dev; main's copies
          #               LAG — resetting them from main would clobber
          #               fresh beta data with weeks-stale copies)
          DEV_OWNED_SUBDIRS="pnw tropical"

          git checkout origin/main -- public/data/
          for sub in $DEV_OWNED_SUBDIRS; do
            if git rev-parse -q --verify "${{ steps.check.outputs.pre_sha }}:public/data/$sub" >/dev/null; then
              git checkout "${{ steps.check.outputs.pre_sha }}" -- "public/data/$sub/"
            fi
          done
          if git diff --cached --quiet; then
            echo "public/data already coherent with main"
            echo "data_realigned=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync(auto): align main-owned data with main (atomic manifest+PNG set)"
            echo "data_realigned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced dev
        if: steps.check.outputs.ahead != '0'
        run: |
          git push origin dev

      - name: Dispatch dev-checks against the new HEAD (code syncs only)
        # GITHUB_TOKEN pushes don't trigger workflows, so a sync that
        # brought CODE to dev dispatches dev-checks explicitly — that
        # keeps the dev preview deploy chain alive (deploy-dev.yml
        # fires on Dev checks success).
        #
        # Data-only syncs (the hourly wind / daily data commits) skip
        # the dispatch: per the 2026-06 stabilization, data-refresh
        # commits must not burn dev-check runs (#137 noise). The dev
        # preview's DATA freshness rides ca-beta's own deploy chain;
        # dev.shouldidive.pages.dev refreshes data on the next code
        # sync. (The old unconditional dispatch existed for dev → main
        # PRs, an anti-pattern CLAUDE.md now bans.)
        if: steps.check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code_changed=$(git diff --name-only "${{ steps.check.outputs.pre_sha }}" HEAD \
            | grep -vE '^public/data(-[a-z]+)?/' | head -1 || true)
          if [ -n "$code_changed" ]; then
            echo "Sync brought code changes (e.g. $code_changed) — dispatching dev-checks"
            gh workflow run dev-checks.yml --ref dev
          else
            echo "Data-only sync — skipping dev-checks dispatch"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sync dev result"
            echo
            if [ "${{ steps.check.outputs.ahead }}" = "0" ]; then
              echo "Dev was already up to date with main. No-op."
            else
              echo "Merged ${{ steps.check.outputs.ahead }} main commit(s) into dev."
              echo "Open dev → main PRs should flip back to MERGEABLE within seconds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
