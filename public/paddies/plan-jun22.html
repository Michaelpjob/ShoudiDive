<style>

	margin-right: 10px;

	        transition: opacity 0.2s linear;
	}

	opacity: 1;

.leaflet-pan-anim .leaflet-tile {

	   -moz-transition: none;
	        transition: none;
	}

	visibility: hidden;
	}

.leaflet-interactive {

svg.leaflet-image-layer.leaflet-interactive path {

.leaflet-container {

.leaflet-container a {

	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {

	font-size: 12px;

.leaflet-bar {

.leaflet-bar a {

.leaflet-control-layers-toggle {

.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:first-child {

	}
.leaflet-bar a.leaflet-disabled {

	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;

.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;

.leaflet-control-zoom-out {

	margin: 5px -10px 5px -6px;

.leaflet-control-scale-line:not(:first-child):not(:last-child) {

	}

.leaflet-touch .leaflet-control-attribution,

.leaflet-touch .leaflet-control-layers,

.leaflet-popup {

.leaflet-popup-content-wrapper {

	}
.leaflet-popup-content p {
	margin: 17px 0;

	}
.leaflet-popup-tip-container {

	margin-left: -20px;

	pointer-events: none;
	}
.leaflet-popup-tip {

	border: 1px solid #fff;

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;

.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

	}
.leaflet-tooltip-bottom:before {

	margin-left: -6px;

	}

}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

.leaflet-tooltip-left:before {

#hdr small{display:block;font-weight:400;color:#9aa8b8;font-size:12px;margin-top:2px;line-height:1.4}

.leaflet-tooltip.plan-lbl::before{display:none!important}

<span><span style="display:inline-block;width:18px;border-top:2px dashed #fff;vertical-align:4px"></span> your run</span>
<span><span style="display:inline-block;width:18px;border-top:3px solid #ffd56b;vertical-align:4px"></span> paddy drift</span>
</div>
